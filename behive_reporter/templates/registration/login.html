{% extends "base.html" %}

{% block title %}Login - Behive Reporter{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px; padding: 20px;">
        <h3 class="text-center mb-4">Login</h3>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Digite seu usuário" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Digite sua senha" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger mt-2">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <button type="submit" class="btn btn-custom">Entrar</button>
            <p class="text-center mt-3">Não tem uma conta? <a href="{% url 'signup' %}">Cadastrar</a></p>

        </form>
        <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="text-muted">Esqueceu sua senha?</a>
        </div>
    </div>
</div>
{% endblock %}
